<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2e4"><title>緒 ♡ 念｜Our Little Story</title><style>
:root{--brown:#78614e;--cream:#fff8e9;--pink:#f8dce0;--orange:#f8d9bc;--yellow:#fff0b6;--blue:#dbeaf2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--brown);background:linear-gradient(145deg,#fff3e2,#fff7f0 60%,#fce9e7);min-height:100vh}main{max-width:720px;margin:auto;padding:18px 18px 42px}.hero{height:340px;border-radius:28px;position:relative;background:linear-gradient(0deg,rgba(45,31,25,.65),transparent 75%),url('couple.jpg') center 39%/cover;overflow:hidden;box-shadow:0 14px 35px #9e78623b}.hero .caption{position:absolute;bottom:24px;width:100%;text-align:center;color:white;text-shadow:0 2px 9px #46362c;font-family:Georgia,serif;letter-spacing:3px}.caption small{display:block;font-size:13px;margin-bottom:9px}.caption strong{font-size:25px;font-weight:400}.intro{text-align:center;padding:26px 0 19px}.intro .eyebrow{letter-spacing:5px;font-size:12px;color:#a28a76}.intro h1{font-family:Georgia,serif;font-weight:500;font-size:37px;margin:10px 0;color:#a87977}.intro p{line-height:1.9;margin:0;font-size:15px}.panel{background:#fffaf1db;border:1px solid #fff;box-shadow:0 12px 30px #c8a88d23;border-radius:28px;padding:18px}.tile{border:0;border-radius:22px;padding:22px 20px;margin:12px 0;width:100%;text-align:left;color:#785e4e;cursor:pointer;display:block}.tile b{display:block;font-size:22px;margin-bottom:9px}.tile span{font-size:14px;line-height:1.5}.tile i{display:block;text-align:right;font-size:13px;margin-top:15px;font-style:normal}.orange{background:var(--orange)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}footer{text-align:center;padding:24px 0 3px;font-family:Georgia,serif;color:#b49a88;letter-spacing:2px}.back{border:0;background:none;font-size:16px;color:#8b6e59;padding:12px 0;cursor:pointer}.hidden{display:none}h2{font-size:25px;margin:10px 0 5px}.sub{font-size:14px;color:#967d6b;line-height:1.6}.formbox,.entry{background:#fffcf7;border-radius:20px;padding:19px;margin:16px 0;box-shadow:0 5px 22px #bda08422}label{display:block;font-weight:600;font-size:14px;margin:15px 0 7px}input,textarea,select{width:100%;font:inherit;color:#695448;background:#fff;border:1px solid #e9d9cb;border-radius:13px;padding:13px;outline-color:#d6aa9e}textarea{min-height:92px;resize:vertical}.save,.small{border:0;border-radius:14px;background:#b68e80;color:white;padding:13px 22px;font:inherit;cursor:pointer;margin-top:15px}.small{padding:8px 12px;font-size:13px;margin-right:8px}.muted{color:#a18b7d;font-size:13px}.entry{overflow-wrap:anywhere}.entry summary{cursor:pointer;font-size:15px;font-weight:700;padding:8px 0}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#735646;color:#fff;padding:12px 20px;border-radius:15px;box-shadow:0 8px 22px #73564644;z-index:20;max-width:90%;text-align:center}.toast.hidden{display:none}.entry h3{margin:0 0 7px}.entry p{white-space:pre-wrap;line-height:1.65;margin:10px 0}.entry strong{color:#886c57}.tag{display:inline-block;background:#f7e5d4;border-radius:30px;padding:5px 10px;font-size:12px;margin-bottom:10px}@media(min-width:650px){.hero{height:470px}.panel{padding:25px}.tile{padding:28px}}
</style></head><body><main><section id="home"><div class="hero"><div class="caption"><small>OUR LITTLE STORY</small><strong>2026.01.18</strong></div></div><div class="intro"><div class="eyebrow">GROWING IN LOVE</div><h1>緒 ♡ 念</h1><p>願意走進彼此的不同<br>珍惜這份屬於我們的幸福</p></div><div class="panel"><button class="tile orange" onclick="go('talk')"><b>☀ 好好說開</b><span>每一次分歧 都是更懂彼此的機會</span><i>記錄我們的溝通 ↗</i></button><button class="tile yellow" onclick="go('love')"><b>♡ 又戀愛了 😍</b><span>記下每一次心動與開心 還有彼此的小進步</span><i>收藏幸福瞬間 ↗</i></button><button class="tile blue" onclick="go('quiet')"><b>☁ 寶寶悶悶但寶寶不說</b><span>有些心事說不出口 先寫下來</span><i>寫下心裡的話 ↗</i></button><footer>Better Together ♡</footer></div></section><section id="detail" class="hidden"><button class="back" onclick="go('home')">← 回到我們的小天地</button><h2 id="heading"></h2><p class="sub" id="description"></p><form class="formbox" id="form"><div id="fields"></div><button class="save" type="submit">♡ 儲存這份紀錄</button><button class="small hidden" type="button" id="cancel" onclick="cancelEdit()">取消編輯</button></form><h2 style="font-size:19px">我們的紀錄</h2><div id="records"></div></section></main><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script>
const sections={talk:{name:'好好說開',desc:'把彼此的想法好好寫下來，讓每一次溝通都更靠近。',fields:[['date','發生日期','date'],['event','事件','textarea'],['ncare','念寶在意的點','textarea'],['nhope','念寶希望對方怎麼做','textarea'],['xcare','緒寶在意的點','textarea'],['xhope','緒寶希望對方怎麼做','textarea'],['result','討論結果','textarea'],['next','約定討論時間','date']]},love:{name:'又戀愛了 😍',desc:'收藏那些讓我們再次心動的小事。',fields:[['author','誰想留言','select'],['date','紀錄日期','date'],['message','今天想記下什麼幸福瞬間？','textarea']]},quiet:{name:'寶寶悶悶但寶寶不說',desc:'有些心事說不出口，先寫下來。',fields:[['author','誰想留言','select'],['date','紀錄日期','date'],['message','寫下心裡的話','textarea']]}};let current='home',editing=null;const key='xu-nian-records-v2';let toastTimer;function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}function all(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}function store(o){localStorage.setItem(key,JSON.stringify(o))}function go(id){current=id;editing=null;document.getElementById('home').classList.toggle('hidden',id!=='home');document.getElementById('detail').classList.toggle('hidden',id==='home');if(id!=='home'){let s=sections[id];document.getElementById('heading').textContent=s.name;document.getElementById('description').textContent=s.desc;build();render()}window.scrollTo(0,0)}function build(data={}){let s=sections[current];document.getElementById('fields').innerHTML='';for(let [key,label,type] of s.fields){let wrap=document.createElement('div'),lab=document.createElement('label');lab.textContent=label;lab.htmlFor=key;let el;if(type==='textarea'){el=document.createElement('textarea');el.placeholder='在這裡寫下你的心情…'}else if(type==='select'){el=document.createElement('select');for(let val of ['念寶','緒寶']){let opt=document.createElement('option');opt.value=val;opt.textContent=val;el.append(opt)}}else{el=document.createElement('input');el.type='date'}el.id=key;el.name=key;el.value=data[key]||(type==='date'&&key==='date'?new Date().toLocaleDateString('sv-SE'):'');wrap.append(lab,el);document.getElementById('fields').append(wrap)}document.getElementById('cancel').classList.toggle('hidden',editing===null)}document.getElementById('form').onsubmit=e=>{e.preventDefault();let o=all(),arr=o[current]||[],data={};for(let [k] of sections[current].fields)data[k]=document.getElementById(k).value;data.savedAt=editing!==null?arr[editing].savedAt:Date.now();if(editing===null)arr.unshift(data);else arr[editing]=data;o[current]=arr;store(o);editing=null;build();render();notify('♡ 已儲存這份紀錄')};function cancelEdit(){editing=null;build()}function edit(i){editing=i;build((all()[current]||[])[i]);window.scrollTo(0,0)}function removeItem(i){if(!confirm('確定刪除這筆紀錄嗎？'))return;let o=all();o[current].splice(i,1);store(o);render();notify('紀錄已刪除')}function render(){let arr=all()[current]||[],target=document.getElementById('records');target.replaceChildren();if(!arr.length){target.innerHTML='<p class="muted">還沒有紀錄，寫下第一篇屬於你們的故事吧 ♡</p>';return}let sorted=arr.map((data,i)=>({data,i})).sort((a,b)=>(b.data.date||'').localeCompare(a.data.date||'')||(b.data.savedAt||0)-(a.data.savedAt||0));for(let {data,i} of sorted){let box=document.createElement('article');box.className='entry';let details=document.createElement('details'),head=document.createElement('summary');head.textContent=(data.author?data.author+' · ':'')+(data.date||'我們的故事')+(current==='talk'&&data.event?' · '+data.event.slice(0,28):'');details.append(head);for(let [k,label] of sections[current].fields){if(!data[k]||k==='author'||k==='date')continue;let p=document.createElement('p'),b=document.createElement('strong');b.textContent=label+'：';p.append(b,document.createTextNode(data[k]));details.append(p)}let editBtn=document.createElement('button'),delBtn=document.createElement('button');editBtn.className=delBtn.className='small';editBtn.textContent='編輯';delBtn.textContent='刪除';editBtn.onclick=()=>edit(i);delBtn.onclick=()=>removeItem(i);details.append(editBtn,delBtn);box.append(details);target.append(box)}}
</script></body></html>
